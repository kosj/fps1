name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

# run 단계의 기본 셸에는 pipefail이 없어서 "godot ... | tee log"가 실패해도 통과로 처리된다.
# shell: bash를 명시하면 -eo pipefail로 실행된다.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint GDScript
        run: |
          pip install "gdtoolkit>=4,<5"
          gdlint game maps tests

      - name: Cache Godot editor and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${TAG}_linux.x86_64" ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}

      - name: Import project
        run: |
          chmod +x ~/godot/godot
          ~/godot/godot --headless --import 2>&1 | tee import.log
          ! grep -q "SCRIPT ERROR" import.log

      - name: Run unit tests
        run: |
          ~/godot/godot --headless --script res://tests/run_tests.gd 2>&1 | tee unit.log
          ! grep -q "SCRIPT ERROR" unit.log

      - name: Run gameplay smoke test
        run: |
          ~/godot/godot --headless --fixed-fps 60 res://tests/smoke/smoke.tscn 2>&1 | tee smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      - name: Check the Depot map (spawns, navigation links, sightlines)
        run: |
          ~/godot/godot --headless --fixed-fps 60 res://tests/smoke/map_check.tscn 2>&1 | tee map.log
          ! grep -q "SCRIPT ERROR" map.log

      - name: Run menu smoke test
        run: |
          ~/godot/godot --headless --fixed-fps 60 res://tests/smoke/menu_smoke.tscn 2>&1 | tee menu.log
          ! grep -q "SCRIPT ERROR" menu.log

      - name: Run bot match (6 bots play team deathmatch for 60 simulated seconds)
        run: |
          ~/godot/godot --headless --fixed-fps 60 -- --spectate --bots=6 --exit-after=60 \
            --expect-kills=3 2>&1 | tee botmatch.log
          ! grep -q "SCRIPT ERROR" botmatch.log

      - name: Run domination bot match (bots must capture zones)
        run: |
          ~/godot/godot --headless --fixed-fps 60 -- --spectate --bots=6 --mode=dom \
            --exit-after=60 --expect-zone-captures=2 2>&1 | tee dom.log
          ! grep -q "SCRIPT ERROR" dom.log

      - name: Run network test (server + 2 bot clients, 50 ms delay each way)
        run: GODOT=~/godot/godot tests/net/run_net_test.sh lagcomp

      - name: Run network test with lag compensation off (must mostly miss)
        run: GODOT=~/godot/godot PORT=7789 tests/net/run_net_test.sh nolagcomp

      - name: Run prediction test (sprint, slide, jump under 80 ms delay)
        run: GODOT=~/godot/godot PORT=7790 tests/net/run_net_test.sh prediction

      - name: Export Windows
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --export-release "Windows Desktop" build/windows/fps1.exe
          test -s build/windows/fps1.exe

      - name: Export Web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.html

      # main에 병합될 때마다 웹 빌드를 gh-pages 브랜치에 올린다. GitHub Pages가 이 브랜치를 서비스한다.
      # 빌드 파일로 저장소가 커지지 않도록 매번 커밋 하나로 덮어쓴다.
      - name: Publish web build to the gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/site && cp -r build/web /tmp/site
          cd /tmp/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Export Linux dedicated server
        run: |
          mkdir -p build/server
          ~/godot/godot --headless --export-release "Linux Server" build/server/fps1_server.x86_64
          test -s build/server/fps1_server.x86_64

      # 계정의 아티팩트 저장 용량이 차면 업로드만 실패하므로 빌드 결과와 분리한다.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: fps1-windows
          path: build/windows

      # 계정의 아티팩트 저장 용량이 차면 업로드만 실패하므로 빌드 결과와 분리한다.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: fps1-web
          path: build/web

      # 계정의 아티팩트 저장 용량이 차면 업로드만 실패하므로 빌드 결과와 분리한다.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: fps1-linux-server
          path: build/server
